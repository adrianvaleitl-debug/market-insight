name: Build and publish Market Insight release

on:
  push:
    branches: [main]
    paths:
      - "market_insight.py"
      - "requirements.txt"
      - "SETUP_AND_START.bat"
      - "START_IN_DIAGNOSTIC_MODE.bat"
      - "Start_Market_Insight.vbs"
      - "tools/generate_icon.py"
      - "Create_Desktop_Shortcut.ps1"
      - "tools/DEBUG_START.bat"
      - "README.md"
      - "index.html"
      - "favicon.svg"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install icon generator dependency
        run: python -m pip install Pillow

      - name: Generate app icon and check Python syntax
        run: |
          python tools/generate_icon.py
          python -m py_compile market_insight.py tools/generate_icon.py

      - name: Assemble a clean download folder
        run: |
          mkdir -p Market_Insight
          cp market_insight.py requirements.txt SETUP_AND_START.bat \
            Start_Market_Insight.vbs market_insight.ico \
            START_IN_DIAGNOSTIC_MODE.bat Create_Desktop_Shortcut.ps1 README.md Market_Insight/
          zip -r Market_Insight_v1.2.20.zip Market_Insight

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.2.20 Market_Insight_v1.2.20.zip \
            --title "Market Insight v1.2.20" \
            --notes "## Market Insight v1.2.20

- Test release to verify the in-app GitHub update check and download prompt; no functional changes

          - Added a full creator credits section at the bottom of Settings with TikTok, website and GitHub links
          - Added an Overview footer showing Adrian Vale and the TikTok profile link
          - Added Adrian Vale to the bottom of the left sidebar
          - Set Maximised as the default startup mode, with options for Maximised, Full screen or Windowed
          - Fixed display-mode settings so they save independently without triggering unrelated settings controls
          - Added F11 to toggle Full screen and Escape to leave it; keyboard shortcuts work while child controls have focus
          - Rendered stock result cards in small batches to reduce interface pauses and redraw lag
          - Reduced progress-label updates during large watchlist scans
          - Added a Windows startup setting to open Market Insight when you sign in
          - Prevented multiple copies of Market Insight from running at the same time
          - Added automatic and manual GitHub update checks with a confirmed ZIP download
          - Added clear Create desktop shortcut and Remove desktop shortcut buttons in Settings
          - Moved useful website and creator links to the top of the Settings help and credits section
          - Combined the Settings page into three larger sections for easier navigation
          - Replaced bright green interface accents with a softer grey-sage palette
          - Centered the dropdown options in Settings for a cleaner, more balanced layout
          - Expanded Settings with clear explanations of scan intervals, score thresholds, platform links, appearance and credential storage
          - Expanded About with plain-English explanations of the scanner indicators, a practical research routine and source links
          - Added a sidebar account summary with Alpaca connection status, a masked API Key ID, selected trading platform and useful quick links
          - Kept the Alpaca Secret Access Key hidden; credentials remain stored in Windows Credential Manager
          - Preserved existing scanning, market pulse, position calculator, watchlist and platform features

          Python 3 is still required. Educational research software only; not financial advice."
