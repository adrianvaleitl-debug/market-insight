name: Build and publish Market Insight release

concurrency:
  group: market-insight-release
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "market_insight.py"
      - "requirements.txt"
      - "SETUP_AND_START.bat"
      - "START_IN_DIAGNOSTIC_MODE.bat"
      - "Start_Market_Insight.vbs"
      - "tools/generate_icon.py"
      - "Create_Desktop_Shortcut.ps1"
      - "installer.iss"
      - "tools/DEBUG_START.bat"
      - "README.md"
      - "THIRD_PARTY_NOTICES.md"
      - "index.html"
      - "favicon.svg"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install pip-licenses
          pip-licenses --format=markdown --with-urls --output-file=THIRD_PARTY_LICENSES.md

      - name: Generate icon and check Python syntax
        run: |
          python tools/generate_icon.py
          python -m py_compile market_insight.py tools/generate_icon.py

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "Market Insight" --icon market_insight.ico --add-data "market_insight.ico;." --add-data "THIRD_PARTY_NOTICES.md;." --add-data "THIRD_PARTY_LICENSES.md;." --collect-all customtkinter --collect-all keyring --collect-all yfinance --collect-all pandas --collect-all certifi --collect-all curl_cffi --collect-all requests --collect-all tzdata market_insight.py
          if (!(Test-Path "dist/Market Insight/Market Insight.exe")) { throw "The packaged application executable was not created." }
          $bundledIcon = Get-ChildItem -Path "dist/Market Insight" -Filter "market_insight.ico" -File -Recurse | Select-Object -First 1
          if (!$bundledIcon) { throw "The current application icon was not bundled into the packaged application." }
          Write-Host "Bundled taskbar icon: $($bundledIcon.FullName)"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build single-file installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path "installer-output/Market_Insight_Setup_V2.3.exe")) { throw "The Windows installer was not created." }

      - name: Assemble source ZIP for existing users
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Market_Insight | Out-Null
          Copy-Item market_insight.py, requirements.txt, SETUP_AND_START.bat, Start_Market_Insight.vbs, market_insight.ico, START_IN_DIAGNOSTIC_MODE.bat, Create_Desktop_Shortcut.ps1, README.md, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.md -Destination Market_Insight
          Compress-Archive -Path Market_Insight -DestinationPath Market_Insight_V2.3.zip -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view V2.3 --repo adrianvaleitl-debug/market-insight 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create V2.3 --repo adrianvaleitl-debug/market-insight --title "Market Insight V2.3" --notes "Market Insight V2.3 adds a required first-launch risk and liability acknowledgement and expands the website and app disclaimers." --target main
            if ($LASTEXITCODE -ne 0) { throw "Could not create the V2.3 GitHub release." }
          }
          gh release upload V2.3 "installer-output/Market_Insight_Setup_V2.3.exe" "Market_Insight_V2.3.zip" --repo adrianvaleitl-debug/market-insight --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the V2.3 release assets." }
          gh release edit V2.3 --repo adrianvaleitl-debug/market-insight --title "Market Insight V2.3" --notes "Market Insight V2.3 rebuilds the Windows acrylic backdrop and transparency layer, moves the accent spotlight onto the transparent host, and redesigns the in-app release history."
          if ($LASTEXITCODE -ne 0) { throw "Could not update the V2.3 release notes." }
