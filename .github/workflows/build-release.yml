name: Build and publish Market Insight release

on:
  push:
    branches: [main]
    paths:
      - "market_insight.py"
      - "requirements.txt"
      - "SETUP_AND_START.bat"
      - "START_IN_DIAGNOSTIC_MODE.bat"
      - "Start_Market_Insight.vbs"
      - "tools/generate_icon.py"
      - "Create_Desktop_Shortcut.ps1"
      - "tools/DEBUG_START.bat"
      - "README.md"
      - "index.html"
      - "favicon.svg"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install icon generator dependency
        run: python -m pip install Pillow

      - name: Generate app icon and check Python syntax
        run: |
          python tools/generate_icon.py
          python -m py_compile market_insight.py tools/generate_icon.py

      - name: Assemble a clean download folder
        run: |
          mkdir -p Market_Insight
          cp market_insight.py requirements.txt SETUP_AND_START.bat \
            Start_Market_Insight.vbs market_insight.ico \
            START_IN_DIAGNOSTIC_MODE.bat Create_Desktop_Shortcut.ps1 README.md Market_Insight/
          zip -r Market_Insight_v1.2.9.zip Market_Insight

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.2.9 Market_Insight_v1.2.9.zip \
            --title "Market Insight v1.2.9" \
            --notes "## Market Insight v1.2.9

          - Improved text wrapping so headings, descriptions, stock metrics and warnings adapt to the available panel width
          - Reflowed stock result details so prices, metrics and platform buttons no longer compete for one horizontal row
          - Added a cool-toned, rounded glass-inspired visual theme with subtle borders and layered panels
          - Enabled the native Windows 11 frosted backdrop where supported, with a graceful fallback on older Windows versions
          - Preserved the existing v1.2.3-based layout, scanner, calculator, watchlist, settings and platform features

          Python 3 is still required. Educational research software only; not financial advice."
