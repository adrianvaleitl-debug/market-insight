name: Build and publish Market Insight release

on:
  push:
    branches: [main]
    paths:
      - "market_insight.py"
      - "requirements.txt"
      - "SETUP_AND_START.bat"
      - "START_IN_DIAGNOSTIC_MODE.bat"
      - "Start_Market_Insight.vbs"
      - "tools/generate_icon.py"
      - "Create_Desktop_Shortcut.ps1"
      - "tools/DEBUG_START.bat"
      - "README.md"
      - "index.html"
      - "favicon.svg"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install icon generator dependency
        run: python -m pip install Pillow

      - name: Generate app icon and check Python syntax
        run: |
          python tools/generate_icon.py
          python -m py_compile market_insight.py tools/generate_icon.py

      - name: Assemble a clean download folder
        run: |
          mkdir -p Market_Insight
          cp market_insight.py requirements.txt SETUP_AND_START.bat \
            Start_Market_Insight.vbs market_insight.ico \
            START_IN_DIAGNOSTIC_MODE.bat Create_Desktop_Shortcut.ps1 README.md Market_Insight/
          zip -r Market_Insight_v1.2.7.zip Market_Insight

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.2.7 Market_Insight_v1.2.7.zip \
            --title "Market Insight v1.2.7" \
            --notes "## Market Insight v1.2.7

          - Removed the responsive layout and resize-behaviour changes, restoring the original fixed two-column Overview layout
          - Kept text wrapping so card headings, descriptions and calculator output fit their available space
          - Redesigned the scan status badge with a clearer finished state and a checked-stock count
          - Moved the position size calculator onto the main Overview screen in a dedicated right-hand panel
          - Removed the calculator from Settings so it is available alongside scan results
          - Calculator settings remain saved and update the displayed example when changed
          - Improved wording throughout the app to make instructions, settings, results, warnings and error messages easier to understand
          - Kept all app features, calculations, layout and behaviour unchanged
          - Fixed an invisible startup issue by keeping the root window mapped while the first-run setup dialog opens
          - Replaced app and website branding with the supplied custom charcoal tile and angular silver M logo
          - The app loads its branded icon automatically, including when market_insight.py is opened directly
          - First launch asks once whether to create a desktop shortcut; the choice is remembered and can be changed in Settings
          - Removed the hidden Python-to-Python startup handoff that could conceal startup failures
          - Normal setup and desktop shortcut launches remain windowless through their dedicated launchers
          - Added a visible diagnostic launcher and persistent startup and Tkinter callback error logs
          - App settings and diagnostic logs are stored separately in the user's AppData folder, with existing preferences migrated
          - One clearly named setup file installs dependencies and starts the app
          - Download package is cleaned of developer-only scripts and duplicate instructions
          - Includes the existing Alpaca setup, platform selection, scanner, and watchlist features

          Python 3 is still required. Educational research software only; not financial advice."
