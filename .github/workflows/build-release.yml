name: Build and publish Market Insight release

on:
  push:
    branches: [main]
    paths:
      - "market_insight.py"
      - "requirements.txt"
      - "SETUP_AND_START.bat"
      - "Start_Market_Insight.vbs"
      - "generate_icon.py"
      - "Create_Desktop_Shortcut.ps1"
      - "DEBUG_START.bat"
      - "README.md"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install icon generator dependency
        run: python -m pip install Pillow

      - name: Generate app icon and check Python syntax
        run: |
          python generate_icon.py
          python -m py_compile market_insight.py generate_icon.py

      - name: Assemble a clean download folder
        run: |
          mkdir -p Market_Insight
          cp market_insight.py requirements.txt SETUP_AND_START.bat \
            Start_Market_Insight.vbs generate_icon.py market_insight.ico \
            Create_Desktop_Shortcut.ps1 DEBUG_START.bat README.md Market_Insight/
          zip -r Market_Insight_v1.1.3.zip Market_Insight

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.3 Market_Insight_v1.1.3.zip \
            --title "Market Insight v1.1.3" \
            --notes "## Market Insight v1.1.3

          - One-click setup installs dependencies, prepares the app icon, and creates the desktop shortcut automatically
          - Normal launch remains hidden and opens the branded app directly
          - Cleaner download folder with only the files needed to install, run, or diagnose the app
          - Includes the existing Alpaca setup, platform selection, scanner, and watchlist features

          Python 3 is still required. Educational research software only; not financial advice."
